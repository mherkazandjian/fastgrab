[tool.poetry]
name = "fastgrab"
version = "0.3.0"
description = "Low level screen capture package with a numpy interface"
authors = ["Mher Kazandjian <mherkazandjian@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/mherkazandjian/fastgrab"
repository = "https://github.com/mherkazandjian/fastgrab"
keywords = ["screenshot", "screen-capture", "x11", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
packages = [{include = "fastgrab"}]
include = [
    {path = "fastgrab/linux_x11/*.c", format = "sdist"},
    {path = "fastgrab/backends/protocols/*.xml", format = ["sdist", "wheel"]},
    {path = "fastgrab/backends/protocols/*.py", format = ["sdist", "wheel"]},
]
# Explicit excludes: Poetry only honours .gitignore when git is available,
# and the dev container (where `make build docker=1` runs) has none — so
# IDE leftovers and caches under fastgrab/ would otherwise be packaged into
# the sdist AND the wheel. Stale in-place *.so builds can't be excluded by
# pattern (the build hook's fresh output has the same name and must be
# packaged), so `make build` deletes them before invoking poetry.
exclude = [
    "fastgrab/**/__pycache__",
    "fastgrab/linux_x11/cmake-build-debug",
    "fastgrab/linux_x11/.idea",
    "fastgrab/linux_x11/CMakeLists.txt",
]
build = "build.py"

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.26"
pywayland = {version = "^0.4.17", optional = true}
PyGObject = {version = ">=3.42", optional = true}
python-xlib = {version = "*", optional = true}
Pillow = {version = "*", optional = true}

[tool.poetry.extras]
wayland = ["pywayland"]
# PyGObject reaches GStreamer and Gio; both need system packages that pip
# cannot install (gir1.2-gst-plugins-base-1.0, gstreamer1.0-pipewire and
# a girepository build environment). Documented, not silently assumed.
portal = ["PyGObject"]
# The name the docs and the backend's own error messages used while this
# was a stub. It pulled in dbus-next, which nothing imports and which
# cannot introspect the portal anyway (see fastgrab/backends/portal.py),
# so anyone who followed that advice installed a dead library and still
# had no working backend. Kept as an alias so the command does not break.
wayland-portal = ["PyGObject"]
wayland-all = ["pywayland", "PyGObject"]
gui = ["python-xlib", "Pillow"]

[tool.poetry.scripts]
fastgrab-record = "fastgrab.recording.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "*"
python-xlib = "*"

[build-system]
# Build against NumPy 2.x headers: per NumPy's downstream-packaging
# guidance, binaries built against 2.x are runtime-compatible with
# NumPy 1.x (the C extension only uses the plain buffer API), so this
# does not conflict with the >=1.26 runtime floor above.
requires = ["poetry-core>=1.5.0", "setuptools", "numpy>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "integration: pixel-level tests that mutate X server state (need DISPLAY + xsetroot)",
    "wayland: pixel-level tests that exercise the Wayland (wlr-screencopy) backend (need WAYLAND_DISPLAY + a wlroots compositor like cage)",
    "no_display: tests that drive fakes and need no display server, so the require_some_display gate lets them run on a headless box",
    "portal: tests that need a PipeWire graph with a synthetic video source (the test-portal compose service)",
]
